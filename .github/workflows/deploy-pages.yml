name: Deploy Core 1 Mastery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: Core_1_Mastery_10-10_FINAL_FIXED

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Content audit
        run: npm run audit:content

      - name: Build production site
        run: npm run build

      - name: Prepare GitHub Pages SPA shell
        run: |
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
          fi
          test -f dist/client/index.html
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Core_1_Mastery_10-10_FINAL_FIXED/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
